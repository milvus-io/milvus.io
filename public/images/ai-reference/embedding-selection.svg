<title id="title">Shortlist models by the workload</title>
<desc id="desc">Representation: Dense, sparse or multi-vector: Match the retrieval mechanism.. Input contract: Text, image, audio or document: Check language and length limits.. Deployment: Local weights or hosted API: Check rights, privacy and versioning.. Application evaluation: Your queries and evidence: Compare quality, latency and cost.. Keep model revisions separate; equal dimensions do not mean equal spaces.</desc>
