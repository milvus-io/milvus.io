<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc"><title id="title">两路召回，检查同一个候选池</title><desc id="desc">两路召回，检查同一个候选池. 两路都漏掉的证据，融合无法补回。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs><rect width="960" height="400" fill="#FAF6EE"/><g font-family="Georgia, Noto Serif SC, serif"><text x="36" y="42" text-anchor="start" font-size="12" fill="#6B6356" font-weight="400">MILVUS / AI REFERENCE / CONCEPT DIAGRAM</text><text x="36" y="87" text-anchor="start" font-size="26" fill="#0F1F2E" font-weight="700">两路召回，检查同一个候选池</text><rect x="45" y="142" width="230" height="66" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="160.0" y="174" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">稠密查询</text><rect x="45" y="230" width="230" height="66" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="160.0" y="262" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">BM25 查询</text><rect x="380" y="185" width="220" height="88" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="490.0" y="217" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">排名融合</text><rect x="690" y="185" width="230" height="88" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="805.0" y="217" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">按需模型重排</text><path d="M275 175 L380 214" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><path d="M275 264 L380 244" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 229 L690 229" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><path d="M36 356H924" stroke="#0F1F2E" stroke-width="1.5"/><text x="36" y="382" text-anchor="start" font-size="15" fill="#6B6356" font-weight="400">两路都漏掉的证据，融合无法补回。</text></g></svg>