<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 614" width="640" height="614" role="img" aria-labelledby="title desc">
<title id="title">Library, index layer and database</title>
<desc id="desc">Applications: Use SDKs to write, filter and search collections.. Milvus: Owns schemas, distributed serving and lifecycle.. Knowhere: Provides the vector-index abstraction and integration.. Index implementations: FAISS and other engines supply search algorithms.. An ANN library supplies algorithms; a database adds operational semantics.</desc>
