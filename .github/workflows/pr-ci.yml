name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, i18n and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Normally written by next.config.js from the CMS. Type-checking needs its
      # shape, but must not call a private service.
      - run: node -e "require('fs').writeFileSync('global-stats.json', JSON.stringify({milvusStars:0,pipInstall:0}))"
      - name: Typecheck
        run: pnpm exec tsc --noEmit --incremental false
      - name: Validate i18n locale JSON
        run: node scripts/validate-i18n-json.js
      - name: Unit tests
        run: node --test tests/*.test.cjs
