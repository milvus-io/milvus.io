<text x="44" y="646" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Decision</tspan><tspan x="44" dy="29.9">criteria</tspan></text>
<text x="248" y="645" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Data control + SLO + total</tspan><tspan x="248" dy="27.3">cost</tspan></text>
<text x="248" y="707" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Validate the support and</tspan><tspan x="248" dy="24.7">compliance scope.</tspan></text>
