<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-labelledby="title desc">
<title id="title">The same query can produce different rankings</title>
<desc id="desc">For query q=(1,0), vector A=(0.8,0.6), and B=(2,0), cosine and inner product rank B first while squared L2 ranks A first. All coordinates and scores are toy calculations.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="820" fill="#FAF6EE"/>
<text x="28" y="30" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">MILVUS / AI REFERENCE / MECHANISM</tspan></text>
<text x="28" y="72" text-anchor="start" font-family="Georgia, serif" font-size="27" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">The same query can produce different</tspan><tspan x="28" dy="35.1">rankings</tspan></text>
<path d="M90 370 L550 370" fill="none" stroke="#0F1F2E" stroke-width="2"/>
<path d="M90 370 L90 175" fill="none" stroke="#0F1F2E" stroke-width="2"/>
<path d="M90 370 L234.0 262.0" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M90 370 L450 370" fill="none" stroke="#F4B860" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M90 370 L270 370" fill="none" stroke="#E85A2B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M234.0 262.0 L234.0 370" fill="none" stroke="#6B6356" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M234.0 262.0 L270 370" fill="none" stroke="#1E5F70" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="270" cy="370" r="8" fill="#E85A2B" stroke="#0F1F2E" stroke-width="1.5"/>
<circle cx="234.0" cy="262.0" r="8" fill="#1E5F70" stroke="#0F1F2E" stroke-width="1.5"/>
<circle cx="450" cy="370" r="8" fill="#F4B860" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="45" y="400" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="400"><tspan x="45" dy="0">O</tspan></text>
<text x="240" y="410" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#E85A2B" font-weight="400"><tspan x="240" dy="0">q=(1,0)</tspan></text>
<text x="135" y="225" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#1E5F70" font-weight="400"><tspan x="135" dy="0">A=(0.8,0.6)</tspan></text>
<text x="440" y="405" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#0F1F2E" font-weight="400"><tspan x="440" dy="0">B=(2,0)</tspan></text>
<text x="28" y="475" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">Metric</tspan></text>
<text x="235" y="475" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="700"><tspan x="235" dy="0">A</tspan></text>
<text x="360" y="475" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="700"><tspan x="360" dy="0">B</tspan></text>
<text x="470" y="475" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="700"><tspan x="470" dy="0">Closer</tspan></text>
<path d="M28 493 L612 493" fill="none" stroke="#E5DDD0" stroke-width="2"/>
<text x="28" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="400"><tspan x="28" dy="0">Cosine</tspan></text>
<text x="235" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="235" dy="0">0.8</tspan></text>
<text x="360" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="360" dy="0">1.0</tspan></text>
<text x="470" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F7D4B" font-weight="700"><tspan x="470" dy="0">B</tspan></text>
<path d="M28 553 L612 553" fill="none" stroke="#E5DDD0" stroke-width="2"/>
<text x="28" y="585" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="400"><tspan x="28" dy="0">Inner product</tspan></text>
<text x="235" y="585" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="235" dy="0">0.8</tspan></text>
<text x="360" y="585" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="360" dy="0">2.0</tspan></text>
<text x="470" y="585" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F7D4B" font-weight="700"><tspan x="470" dy="0">B</tspan></text>
<path d="M28 613 L612 613" fill="none" stroke="#E5DDD0" stroke-width="2"/>
<text x="28" y="645" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="400"><tspan x="28" dy="0">Squared L2</tspan></text>
<text x="235" y="645" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="235" dy="0">0.4</tspan></text>
<text x="360" y="645" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="400"><tspan x="360" dy="0">1.0</tspan></text>
<text x="470" y="645" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F7D4B" font-weight="700"><tspan x="470" dy="0">A</tspan></text>
<path d="M28 744 L612 744" fill="none" stroke="#0F1F2E" stroke-width="2"/>
<text x="28" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">Cosine: angle. IP: direction and magnitude. L2: separation.</tspan></text>
</svg>
