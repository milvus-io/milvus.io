<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 752" width="640" height="752" role="img" aria-labelledby="title desc">
<title id="title">Agent memory has different jobs and owners</title>
<desc id="desc">Working: Current task state: Keep a bounded prompt or explicit state store.. Episodic: Past experiences: Retrieve applicable episodes and outcomes.. Semantic: Reusable facts: Track provenance, validity and corrections.. Procedural: Skills and routines: Version instructions and verify applicability.. One vector collection does not replace every state or persistence mechanism.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
