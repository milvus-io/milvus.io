<text x="28" y="72" text-anchor="start" font-family="Georgia, serif" font-size="27" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">DiskANN separates routing codes from</tspan><tspan x="28" dy="35.1">SSD data</tspan></text>
