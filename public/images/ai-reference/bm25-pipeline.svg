<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 656" width="640" height="656" role="img" aria-labelledby="title desc">
<title id="title">From words to ranked documents</title>
<desc id="desc">Analyze text: Tokenize and normalize documents and queries.. Read posting lists: Find documents sharing analyzed query terms.. Score with BM25: Combine IDF, saturating term frequency and length.. Return top-k: Scores rank matches; they are not probabilities.. Lexical overlap and semantic similarity are complementary signals.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="656" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">From words to ranked documents</tspan></text>
<rect x="28" y="110" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="110" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="141" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Analyze text</tspan></text>
<text x="48" y="171" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Tokenize and normalize documents and queries.</tspan></text>
<path d="M320 199 V218" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="222" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="222" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="253" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Read posting lists</tspan></text>
<text x="48" y="283" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Find documents sharing analyzed query terms.</tspan></text>
<path d="M320 311 V330" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="334" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="334" width="5" height="112" fill="#1E5F70"/>
<text x="48" y="365" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Score with BM25</tspan></text>
<text x="48" y="395" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Combine IDF, saturating term frequency and</tspan><tspan x="48" dy="26">length.</tspan></text>
<path d="M320 449 V468" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="472" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="472" width="5" height="86" fill="#E85A2B"/>
<text x="48" y="503" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Return top-k</tspan></text>
<text x="48" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Scores rank matches; they are not probabilities.</tspan></text>
<path d="M28 580 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="606" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">Lexical overlap and semantic similarity are complementary</tspan><tspan x="28" dy="23.4">signals.</tspan></text>
</svg>
