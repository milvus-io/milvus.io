<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc"><title id="title">从问题到可核查证据</title><desc id="desc">从问题到可核查证据. 模型生成表示，数据库召回，应用核查证据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs><rect width="960" height="400" fill="#FAF6EE"/><g font-family="Georgia, Noto Serif SC, serif"><text x="36" y="42" text-anchor="start" font-size="12" fill="#6B6356" font-weight="400">MILVUS / AI REFERENCE / CONCEPT DIAGRAM</text><text x="36" y="87" text-anchor="start" font-size="26" fill="#0F1F2E" font-weight="700">从问题到可核查证据</text><rect x="35" y="165" width="200" height="102" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="135.0" y="197" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">问题与权限范围</text><text x="47" y="151" text-anchor="start" font-size="14" fill="#E85A2B" font-weight="700">01</text><path d="M235 216 L266 216" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="165" width="200" height="102" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="370.0" y="197" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">匹配的查询编码器</text><text x="282" y="151" text-anchor="start" font-size="14" fill="#E85A2B" font-weight="700">02</text><path d="M470 216 L501 216" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="165" width="200" height="102" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="605.0" y="197" text-anchor="middle" font-size="18" fill="#0F1F2E" font-weight="400">合格的近邻候选</text><text x="517" y="151" text-anchor="start" font-size="14" fill="#E85A2B" font-weight="700">03</text><path d="M705 216 L736 216" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="165" width="200" height="102" fill="#F4ECDC