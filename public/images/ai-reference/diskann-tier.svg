<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" role="img" aria-labelledby="title desc">
<title id="title">DiskANN separates routing codes from SSD data</title>
<desc id="desc">A query compares compact PQ codes and cached nodes in RAM, selects node IDs to visit, and reads graph neighbors plus full vectors from SSD. Cache and I/O behavior affect latency.</desc>
