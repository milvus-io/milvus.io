<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" width="640" height="692" role="img" aria-labelledby="title desc">
<title id="title">Application clusters are explicit labels</title>
<desc id="desc">Read vectors and IDs: Use Spark or a bounded data-export workflow.. Run clustering outside ANN: Fit k-means, HDBSCAN or another chosen method.. Write versioned labels: Keep record ID, cluster_id and algorithm revision.. Use labels in Milvus: Filter, sample or analyze application groups.. Internal IVF centroid assignments are not application cluster IDs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="692" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Application clusters are explicit</tspan><tspan x="28" dy="36.4">labels</tspan></text>
<rect x="28" y="146" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="146" width="5" height="86" fill="#1E5F70"/>
