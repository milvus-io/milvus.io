<text x="48" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Loads data, calls models and orchestrates</tspan><tspan x="48" dy="26">retrieval.</tspan></text>
