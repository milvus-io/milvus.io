<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840" width="640" height="840" role="img" aria-labelledby="title desc">
<title id="title">Postings first, then BM25 scoring</title>
<desc id="desc">An inverted list maps a term to matching document IDs. BM25 then combines inverse document frequency, saturating term frequency, and document-length normalization. The plotted term-frequency factor uses k1=1.2 and average document length.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="840" fill="#FAF6EE"/>
<text x="28" y="30" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">MILVUS / AI REFERENCE / MECHANISM</tspan></text>
<text x="28" y="72" text-anchor="start" font-family="Georgia, serif" font-size="27" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">Postings first, then BM25 scoring</tspan></text>
<text x="28" y="132" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">Query term: HNSW</tspan></text>
<rect x="40" y="160" width="155" height="64" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="60" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#1E5F70" font-weight="700"><tspan x="60" dy="0">HNSW</tspan></text>
<rect x="300" y="160" width="135" height="64" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
