<text x="248" y="603" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Supports AI-oriented data</tspan><tspan x="248" dy="24.7">workflows.</tspan></text>
