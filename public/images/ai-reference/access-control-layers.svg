<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" width="640" height="692" role="img" aria-labelledby="title desc">
<title id="title">Authorization and retrieval filters are separate</title>
<desc id="desc">Authenticate the caller: Establish an identity at the service boundary.. Authorize operations: Use RBAC and service-side permission checks.. Derive a trusted scope: Apply tenant and document-access constraints.. Search and audit: Return only authorized evidence and record access.. An untrusted caller-supplied tenant filter is not an access-control boundary.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="692" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Authorization and retrieval filters</tspan><tspan x="28" dy="36.4">are separate</tspan></text>
<rect x="28" y="146" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="146" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="177" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Authenticate the caller</tspan></text>
<text x="48" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Establish an identity at the service boundary.</tspan></text>
<path d="M320 235 V254" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="258" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="258" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Authorize operations</tspan></text>
<text x="48" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Use RBAC and service-side permission checks.</tspan></text>
<path d="M320 347 V366" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="370" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="370" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="401" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Derive a trusted scope</tspan></text>
<text x="48" y="431" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Apply tenant and document-access constraints.</tspan></text>
<path d="M320 459 V478" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="482" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="482" width="5" height="112" fill="#E85A2B"/>
<text x="48" y="513" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Search and audit</tspan></text>
<text x="48" y="543" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Return only authorized evidence and record</tspan><tspan x="48" dy="26">access.</tspan></text>
<path d="M28 616 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="642" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">An untrusted caller-supplied tenant filter is not an</tspan><tspan x="28" dy="23.4">access-control boundary.</tspan></text>
</svg>
