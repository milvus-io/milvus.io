<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" width="640" height="630" role="img" aria-labelledby="title desc">
<title id="title">CAGRA uses parallel GPU graph search</title>
<desc id="desc">Build a neighbor graph: Choose graph degree and build configuration.. Explore on the GPU: Parallel work expands candidate neighborhoods.. Keep a candidate pool: Search width and pool size trade work for recall.. Measure the workload: Include batches, transfers and GPU memory.. A GPU needs enough useful work; compare at the same recall target.</desc>
