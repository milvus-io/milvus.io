<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 718" width="640" height="718" role="img" aria-labelledby="title desc">
<title id="title">A backup is useful when a restore succeeds</title>
<desc id="desc">Define the recovery target: Choose acceptable data loss and recovery time.. Capture the required state: Back up data, metadata and configuration safely.. Restore in isolation: Check IDs, counts, indexes, filters and query behavior.. Rehearse the cutover: Record timing, replay steps and rollback evidence.. Replication, CDC, snapshots and backup solve different recovery problems.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="718" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">A backup is useful when a restore</tspan><tspan x="28" dy="36.4">succeeds</tspan></text>
<rect x="28" y="146" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="146" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="177" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Define the recovery target</tspan></text>
<text x="48" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Choose acceptable data loss and recovery time.</tspan></text>
<path d="M320 235 V254" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="258" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="258" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Capture the required state</tspan></text>
<text x="48" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Back up data, metadata and configuration safely.</tspan></text>
<path d="M320 347 V366" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="370" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="370" width="5" height="112" fill="#1E5F70"/>
<text x="48" y="401" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Restore in isolation</tspan></text>
<text x="48" y="431" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Check IDs, counts, indexes, filters and query</tspan><tspan x="48" dy="26">behavior.</tspan></text>
<path d="M320 485 V504" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="508" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="508" width="5" height="112" fill="#E85A2B"/>
<text x="48" y="539" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Rehearse the cutover</tspan></text>
<text x="48" y="569" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Record timing, replay steps and rollback</tspan><tspan x="48" dy="26">evidence.</tspan></text>
<path d="M28 642 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="668" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">Replication, CDC, snapshots and backup solve different</tspan><tspan x="28" dy="23.4">recovery problems.</tspan></text>
</svg>
