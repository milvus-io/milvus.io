<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 704" width="640" height="704" role="img" aria-labelledby="title desc">
<title id="title">Join by stable identity, not file position</title>
<desc id="desc">Source record: source_id + source version: Identifies the underlying content.. Search row: primary key + chunk_id: Identifies a searchable representation.. Embedding: model + preprocessing version: Identifies its vector space.. Physical location: file + row position: Can change during compaction.. Keep a versioned mapping so refresh, deletion and replay remain traceable.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="704" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Join by stable identity, not file</tspan><tspan x="28" dy="36.4">position</tspan></text>
<rect x="28" y="146" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V264" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Source record</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">source_id + source version</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Identifies the underlying</tspan><tspan x="248" dy="24.7">content.</tspan></text>
<rect x="28" y="276" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 276 V394" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Search row</tspan></text>
<text x="248" y="307" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">primary key + chunk_id</tspan></text>
<text x="248" y="343" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Identifies a searchable</tspan><tspan x="248" dy="24.7">representation.</tspan></text>
<rect x="28" y="406" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 406 V500" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Embedding</tspan></text>
<text x="248" y="437" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">model + preprocessing version</tspan></text>
<text x="248" y="473" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Identifies its vector space.</tspan></text>
<rect x="28" y="512" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 512 V606" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="544" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Physical</tspan><tspan x="44" dy="29.9">location</tspan></text>
<text x="248" y="543" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">file + row position</tspan></text>
<text x="248" y="579" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Can change during compaction.</tspan></text>
<path d="M28 628 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="654" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">Keep a versioned mapping so refresh, deletion and replay</tspan><tspan x="28" dy="23.4">remain traceable.</tspan></text>
</svg>
