<text x="48" y="455" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Pin index settings, queries, labels and metric</tspan><tspan x="48" dy="26">code.</tspan></text>
<rect x="28" y="518" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="518" width="5" height="112" fill="#E85A2B"/>
<text x="48" y="549" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Execution environment</tspan></text>
