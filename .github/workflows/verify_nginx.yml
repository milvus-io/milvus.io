name: Verify Nginx Conf

on:
  pull_request:
    paths:
      - 'conf/conf.d/**'
      - 'Builder.Dockerfile'
      - 'Preview.Dockerfile'
      - 'supervisord.conf'
      - '.github/workflows/verify_nginx.yml'
      - 'tests/nginx-routing.test.cjs'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test routing rules
        run: node --test tests/nginx-routing.test.cjs

      - name: Verify Nginx configuration
        if: always()
        run: |
          docker build --target nginx-runtime -f Builder.Dockerfile .
          docker build --target nginx-runtime -f Preview.Dockerfile .
