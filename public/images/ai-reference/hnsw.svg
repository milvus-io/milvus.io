<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" width="640" height="810" role="img" aria-labelledby="title desc">
<title id="title">HNSW: coarse hops, then local exploration</title>
<desc id="desc">Upper layers contain fewer nodes and permit coarse navigation. Search descends to the bottom layer and explores a candidate frontier. M controls graph connectivity and ef controls search effort.</desc>
