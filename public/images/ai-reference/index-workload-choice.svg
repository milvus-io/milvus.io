<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" width="640" height="810" role="img" aria-labelledby="title desc">
<title id="title">Choose the index by the binding constraint</title>
<desc id="desc">Exact or tiny eligible set: FLAT: Cost grows with the searched data.. RAM + high recall: HNSW: Budget for both vectors and graph.. Compression / larger k: IVF variants: Tune probes and representation.. Data exceeds RAM: DISKANN: Trade memory for local SSD I/O.. Sustained GPU work: GPU_CAGRA / GPU IVF: Check VRAM and supported limits.. These are candidates to benchmark, not universal performance rankings.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="810" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Choose the index by the binding</tspan><tspan x="28" dy="36.4">constraint</tspan></text>
<rect x="28" y="146" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V264" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Exact or tiny</tspan><tspan x="44" dy="29.9">eligible set</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">FLAT</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Cost grows with the searched</tspan><tspan x="248" dy="24.7">data.</tspan></text>
<rect x="28" y="276" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 276 V394" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">RAM + high</tspan><tspan x="44" dy="29.9">recall</tspan></text>
<text x="248" y="307" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">HNSW</tspan></text>
<text x="248" y="343" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Budget for both vectors and</tspan><tspan x="248" dy="24.7">graph.</tspan></text>
<rect x="28" y="406" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 406 V500" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Compression /</tspan><tspan x="44" dy="29.9">larger k</tspan></text>
<text x="248" y="437" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">IVF variants</tspan></text>
<text x="248" y="473" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Tune probes and representation.</tspan></text>
<rect x="28" y="512" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 512 V606" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="544" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Data exceeds</tspan><tspan x="44" dy="29.9">RAM</tspan></text>
<text x="248" y="543" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">DISKANN</tspan></text>
<text x="248" y="579" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Trade memory for local SSD I/O.</tspan></text>
<rect x="28" y="618" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 618 V712" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="650" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Sustained GPU</tspan><tspan x="44" dy="29.9">work</tspan></text>
<text x="248" y="649" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">GPU_CAGRA / GPU IVF</tspan></text>
<text x="248" y="685" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Check VRAM and supported limits.</tspan></text>
<path d="M28 734 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">These are candidates to benchmark, not universal</tspan><tspan x="28" dy="23.4">performance rankings.</tspan></text>
</svg>
