<text x="48" y="269" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Owns schemas, distributed serving and lifecycle.</tspan></text>
<rect x="28" y="306" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
