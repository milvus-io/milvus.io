<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 752" width="640" height="752" role="img" aria-labelledby="title desc">
<title id="title">File formats and table layers solve different jobs</title>
<desc id="desc">Arrow: In-memory columnar batches: Moves typed data between compute stages.. Parquet: Columnar files: Efficient scans and analytical interchange.. Iceberg: Table metadata + snapshots: Tracks schema, files and table versions.. Lance: Data format and dataset tools: Supports AI-oriented data workflows.. Choose an integration against its documented version and capabilities.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="752" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">File formats and table layers solve</tspan><tspan x="28" dy="36.4">different jobs</tspan></text>
