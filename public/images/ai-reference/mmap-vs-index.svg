<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 574" width="640" height="574" role="img" aria-labelledby="title desc">
<title id="title">mmap and DiskANN act at different layers</title>
<desc id="desc">mmap: Kernel pages local files: Index algorithm is unchanged.. DiskANN: Index controls SSD reads: Graph traversal uses RAM codes.. Tiered storage: Fetch remote objects: Local cache and eviction are separate.. A mapped file still consumes physical memory when its pages are resident.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="574" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">mmap and DiskANN act at different</tspan><tspan x="28" dy="36.4">layers</tspan></text>
<rect x="28" y="146" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V240" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">mmap</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Kernel pages local files</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Index algorithm is unchanged.</tspan></text>
<rect x="28" y="252" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 252 V346" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="284" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">DiskANN</tspan></text>
<text x="248" y="283" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Index controls SSD reads</tspan></text>
<text x="248" y="319" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Graph traversal uses RAM codes.</tspan></text>
<rect x="28" y="358" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 358 V476" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="390" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Tiered storage</tspan></text>
<text x="248" y="389" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Fetch remote objects</tspan></text>
<text x="248" y="425" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Local cache and eviction are</tspan><tspan x="248" dy="24.7">separate.</tspan></text>
<path d="M28 498 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="524" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">A mapped file still consumes physical memory when its pages</tspan><tspan x="28" dy="23.4">are resident.</tspan></text>
</svg>
