<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" width="640" height="810" role="img" aria-labelledby="title desc">
<title id="title">MaxSim: take one maximum per query vector</title>
<desc id="desc">Two query vectors and three document vectors yield a 2 by 3 matrix. MaxSim sums each query row maximum. Reversing query and document sums column maxima and gives a different score.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="810" fill="#FAF6EE"/>
<text x="28" y="30" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">MILVUS / AI REFERENCE / MECHANISM</tspan></text>
<text x="28" y="72" text-anchor="start" font-family="Georgia, serif" font-size="27" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">MaxSim: take one maximum per query</tspan><tspan x="28" dy="35.1">vector</tspan></text>
<text x="28" y="153" text-anchor="start" font-family="Arial, sans-serif" font-size="21" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">Dot products of unit vectors</tspan></text>
<text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="700"><tspan x="200" dy="0">d1</tspan></text>
<text x="350" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="700"><tspan x="350" dy="0">d2</tspan></text>
<text x="500" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="700"><tspan x="500" dy="0">d3</tspan></text>
<text x="45" y="275" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="700"><tspan x="45" dy="0">q1</tspan></text>
<rect x="130" y="230" width="140" height="75" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="200" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="400"><tspan x="200" dy="0">0.8</tspan></text>
<rect x="280" y="230" width="140" height="75" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="350" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="400"><tspan x="350" dy="0">0.6</tspan></text>
<rect x="430" y="230" width="140" height="75" fill="#F4B860" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="500" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="700"><tspan x="500" dy="0">1.0</tspan></text>
<text x="45" y="365" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#0F1F2E" font-weight="700"><tspan x="45" dy="0">q2</tspan></text>
<rect x="130" y="320" width="140" height="75" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="200" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="400"><tspan x="200" dy="0">0.6</tspan></text>
<rect x="280" y="320" width="140" height="75" fill="#F4B860" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="350" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="700"><tspan x="350" dy="0">0.8</tspan></text>
<rect x="430" y="320" width="140" height="75" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="500" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0F1F2E" font-weight="400"><tspan x="500" dy="0">0.0</tspan></text>
<text x="28" y="467" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#1E5F70" font-weight="700"><tspan x="28" dy="0">Query-row maxima: 1.0 + 0.8 = 1.8</tspan></text>
<text x="28" y="520" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="700"><tspan x="28" dy="0">Reverse the roles:</tspan></text>
<text x="28" y="558" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="400"><tspan x="28" dy="0">Column maxima: 0.8 + 0.8 + 1.0 = 2.6</tspan></text>
<text x="28" y="618" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">q1=(1,0); q2=(0,1)</tspan></text>
<text x="28" y="651" text-anchor="start" font-family="Arial, sans-serif" font-size="19" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">d1=(0.8,0.6); d2=(0.6,0.8); d3=(1,0)</tspan></text>
<path d="M28 734 L612 734" fill="none" stroke="#0F1F2E" stroke-width="2"/>
<text x="28" y="762" text-anchor="start" font-family="Arial, sans-serif" font-size="18" fill="#6B6356" font-weight="400"><tspan x="28" dy="0">MUVERA / token ANN find candidates; MaxSim scores the vector</tspan><tspan x="28" dy="23.4">lists.</tspan></text>
</svg>
