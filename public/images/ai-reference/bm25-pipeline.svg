<rect x="455" y="160" width="135" height="64" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="471" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#0F1F2E" font-weight="400"><tspan x="471" dy="0">doc 3</tspan></text>
<path d="M195 192 L290 192" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M435 192 L445 192" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
