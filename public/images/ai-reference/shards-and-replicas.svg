<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 730" width="640" height="730" role="img" aria-labelledby="title desc">
<title id="title">Shards divide data; replicas copy serving capacity</title>
<desc id="desc">Shard A: Data subset A: Parallelizes ownership and processing.. Shard B: Data subset B: Adds another part of the corpus.. Replica 1: Serves the full intended scope: Has one set of serving copies.. Replica 2: Another serving copy: Uses additional resources for availability / load.. More shards and more replicas have different resource and routing costs.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="730" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Shards divide data; replicas copy</tspan><tspan x="28" dy="36.4">serving capacity</tspan></text>
<rect x="28" y="146" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V264" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Shard A</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Data subset A</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Parallelizes ownership and</tspan><tspan x="248" dy="24.7">processing.</tspan></text>
<rect x="28" y="276" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 276 V370" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Shard B</tspan></text>
<text x="248" y="307" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Data subset B</tspan></text>
<text x="248" y="343" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Adds another part of the corpus.</tspan></text>
<rect x="28" y="382" width="584" height="120" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 382 V502" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="414" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Replica 1</tspan></text>
<text x="248" y="413" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Serves the full intended</tspan><tspan x="248" dy="27.3">scope</tspan></text>
<text x="248" y="475" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Has one set of serving copies.</tspan></text>
<rect x="28" y="514" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 514 V632" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="546" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Replica 2</tspan></text>
<text x="248" y="545" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Another serving copy</tspan></text>
<text x="248" y="581" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Uses additional resources for</tspan><tspan x="248" dy="24.7">availability / load.</tspan></text>
<path d="M28 654 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">More shards and more replicas have different resource and</tspan><tspan x="28" dy="23.4">routing costs.</tspan></text>
</svg>
