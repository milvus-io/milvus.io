<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" width="640" height="692" role="img" aria-labelledby="title desc">
<title id="title">Use Attu to inspect a reproducible retrieval case</title>
<desc id="desc">Connect to the right instance: Confirm endpoint, identity and permissions.. Inspect the collection: Check schema, indexes, loaded state and row metadata.. Run a known query: Keep the vector, filter and search parameters.. Cross-check with the SDK: Use the same case in a reproducible script.. A UI inspection complements metrics and logs; it does not replace them.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="692" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Use Attu to inspect a reproducible</tspan><tspan x="28" dy="36.4">retrieval case</tspan></text>
<rect x="28" y="146" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="146" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="177" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Connect to the right instance</tspan></text>
<text x="48" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Confirm endpoint, identity and permissions.</tspan></text>
<path d="M320 235 V254" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="258" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="258" width="5" height="112" fill="#1E5F70"/>
<text x="48" y="289" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Inspect the collection</tspan></text>
<text x="48" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Check schema, indexes, loaded state and row</tspan><tspan x="48" dy="26">metadata.</tspan></text>
<path d="M320 373 V392" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="396" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="396" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="427" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Run a known query</tspan></text>
<text x="48" y="457" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Keep the vector, filter and search parameters.</tspan></text>
<path d="M320 485 V504" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="508" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="508" width="5" height="86" fill="#E85A2B"/>
<text x="48" y="539" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Cross-check with the SDK</tspan></text>
<text x="48" y="569" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Use the same case in a reproducible script.</tspan></text>
<path d="M28 616 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="642" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">A UI inspection complements metrics and logs; it does not</tspan><tspan x="28" dy="23.4">replace them.</tspan></text>
</svg>
