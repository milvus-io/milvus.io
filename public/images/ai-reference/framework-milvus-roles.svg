<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 770" width="640" height="770" role="img" aria-labelledby="title desc">
<title id="title">Framework orchestration and vector storage</title>
<desc id="desc">Application or agent: Defines the task, access scope and expected outcome.. Framework integration: Loads data, calls models and orchestrates retrieval.. Milvus collection: Stores vectors and metadata; filters and retrieves.. Application response: Assembles evidence and evaluates the final output.. Framework state, checkpoints and model inference have separate owners.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
