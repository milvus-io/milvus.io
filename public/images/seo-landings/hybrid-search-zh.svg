<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" role="img" aria-labelledby="dg-hybrid-search"><style>text{font-family:Geist,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#010e29}.label{font-size:13px;fill:#36536a}.mini{font-size:11px;fill:#52718a}.strong{font-size:16px;font-weight:600}.flow-line{fill:none;stroke:#4b8eb5;stroke-width:1.6}.node{fill:#fff;stroke:#bed8e8;stroke-width:1.2}.active-node{fill:#010e29;stroke:#010e29}.active-text{fill:#fff}.mint-node{fill:#bfffe7;stroke:#81d5b7;stroke-width:1.2}.blue-node{fill:#d3efff;stroke:#81c9ef;stroke-width:1.2}.dot{fill:#00a1ea}.muted-dot{fill:#a8c3d5}.panel-main{fill:#fff;stroke:#9cc3dc;stroke-width:1.2}.panel-alt{fill:#f6f9fb;stroke:#d5dfe8;stroke-width:1.2}</style><title id="dg-hybrid-search">混合检索 示意图</title><defs><marker id="ar-hybrid-search" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 6 3.5 1 6" fill="none" stroke="#4b8eb5" stroke-width="1.2"/></marker></defs><rect x="60" y="14" width="400" height="62" rx="7" class="node"/><text x="260.0" y="41.5" class="strong" text-anchor="middle">一次查询</text><text x="260.0" y="59.5" class="mini" text-anchor="middle">&quot;white headphones, quiet and comfortable&quot;</text><path d="M260 76V98H88.66666666666667V124" class="flow-line" marker-end="url(#ar-hybrid-search)"/><path d="M260 76V98H260.0V124" class="flow-line" marker-end="url(#ar-hybrid-search)"/><path d="M260 76V98H431.33333333333337V124" class="flow-line" marker-end="url(#ar-hybrid-search)"/><rect x="10.0" y="124" width="157.33333333333334" height="76" rx="7" class="blue-node"/><text x="88.66666666666667" y="151.0" class="strong" text-anchor="middle">BM25 全文检索</text><text x="88.66666666666667" y="169.0" class="mini" text-anchor="middle">原始文本 -&gt; 内置 BM25 稀</text><text x="88.66666666666667" y="184.0" class="mini" text-anchor="middle">疏向量</text><rect x="181.33333333333334" y="124" width="157.33333333333334" height="76" rx="7" class="blue-node"/><text x="260.0" y="