<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" width="640" height="632" role="img" aria-labelledby="title desc">
<title id="title">Range search adds a score condition</title>
<desc id="desc">Search the eligible corpus: Apply the chosen metric, index and filters.. Explore candidates: ANN search may miss qualifying neighbors.. Keep scores in the band: For L2: range_filter &lt;= distance &lt; radius.. Return up to limit: A full result may be truncated; it is not a census.. For COSINE / IP the band is radius &lt; score &lt;= range_filter.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="632" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Range search adds a score condition</tspan></text>
<rect x="28" y="110" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="110" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="141" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Search the eligible corpus</tspan></text>
<text x="48" y="171" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Apply the chosen metric, index and filters.</tspan></text>
<path d="M320 199 V218" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="222" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="222" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="253" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Explore candidates</tspan></text>
<text x="48" y="283" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">ANN search may miss qualifying neighbors.</tspan></text>
<path d="M320 311 V330" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="334" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="334" width="5" height="86" fill="#1E5F70"/>
<text x="48" y="365" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Keep scores in the band</tspan></text>
<text x="48" y="395" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">For L2: range_filter &lt;= distance &lt; radius.</tspan></text>
<path d="M320 423 V442" fill="none" stroke="#1E5F70" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="446" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="446" width="5" height="112" fill="#E85A2B"/>
<text x="48" y="477" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Return up to limit</tspan></text>
<text x="48" y="507" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">A full result may be truncated; it is not a</tspan><tspan x="48" dy="26">census.</tspan></text>
<path d="M28 580 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="606" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">For COSINE / IP the band is radius &lt; score &lt;= range_filter.</tspan></text>
</svg>
