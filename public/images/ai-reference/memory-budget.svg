<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 702" width="640" height="702" role="img" aria-labelledby="title desc">
<title id="title">Vector bytes are only one part of memory</title>
<desc id="desc">Vector representation: Count x dimension x bytes, or compressed code size.. Index and payload: Add graph links, centroids, IDs and scalar fields.. Serving copies: Include the actual shard and replica placement.. Runtime headroom: Budget for queries, ingestion, caches and maintenance.. Payload compression ratios are not whole-service memory reductions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="702" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Vector bytes are only one part of</tspan><tspan x="28" dy="36.4">memory</tspan></text>
<rect x="28" y="146" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
