<text x="44" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Parquet</tspan></text>
<text x="248" y="307" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Columnar files</tspan></text>
<text x="248" y="343" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Efficient scans and analytical</tspan><tspan x="248" dy="24.7">interchange.</tspan></text>
<rect x="28" y="406" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
