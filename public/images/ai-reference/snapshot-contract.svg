<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 728" width="640" height="728" role="img" aria-labelledby="title desc">
<title id="title">Reproduce the experiment, not just the data</title>
<desc id="desc">Data and membership: Pin lake and collection versions; retain the files.. Representation: Pin model revision, preprocessing and chunk boundaries.. Search and labels: Pin index settings, queries, labels and metric code.. Execution environment: Pin software and hardware; repeat and record variance.. A data snapshot alone does not guarantee identical ANN result order.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="728" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Reproduce the experiment, not just</tspan><tspan x="28" dy="36.4">the data</tspan></text>
<rect x="28" y="146" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
