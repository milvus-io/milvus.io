<text x="48" y="331" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Pin model revision, preprocessing and chunk</tspan><tspan x="48" dy="26">boundaries.</tspan></text>
<rect x="28" y="394" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="394" width="5" height="112" fill="#1E5F70"/>
