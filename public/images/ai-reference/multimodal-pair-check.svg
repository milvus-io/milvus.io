<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 728" width="640" height="728" role="img" aria-labelledby="title desc">
<title id="title">Two required signals need two explicit checks</title>
<desc id="desc">Visual candidates: Image similarity: Find visually related assets.. Text candidates: Caption similarity: Find semantically related descriptions.. Required agreement: Check both scores: Intersect or verify the same pair.. Decision record: Keep reasons and IDs: Review uncertain cases before exclusion.. Rank fusion alone does not enforce a visual AND text threshold.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="728" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Two required signals need two</tspan><tspan x="28" dy="36.4">explicit checks</tspan></text>
<rect x="28" y="146" width="584" height="94" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V240" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Visual</tspan><tspan x="44" dy="29.9">candidates</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Image similarity</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Find visually related assets.</tspan></text>
<rect x="28" y="252" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 252 V370" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="284" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Text</tspan><tspan x="44" dy="29.9">candidates</tspan></text>
<text x="248" y="283" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Caption similarity</tspan></text>
<text x="248" y="319" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Find semantically related</tspan><tspan x="248" dy="24.7">descriptions.</tspan></text>
<rect x="28" y="382" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 382 V500" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="414" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Required</tspan><tspan x="44" dy="29.9">agreement</tspan></text>
<text x="248" y="413" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Check both scores</tspan></text>
<text x="248" y="449" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Intersect or verify the same</tspan><tspan x="248" dy="24.7">pair.</tspan></text>
<rect x="28" y="512" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 512 V630" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="544" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Decision</tspan><tspan x="44" dy="29.9">record</tspan></text>
<text x="248" y="543" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Keep reasons and IDs</tspan></text>
<text x="248" y="579" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Review uncertain cases before</tspan><tspan x="248" dy="24.7">exclusion.</tspan></text>
<path d="M28 652 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="678" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">Rank fusion alone does not enforce a visual AND text</tspan><tspan x="28" dy="23.4">threshold.</tspan></text>
</svg>
