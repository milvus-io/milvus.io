<text x="48" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Count x dimension x bytes, or compressed code</tspan><tspan x="48" dy="26">size.</tspan></text>
<rect x="28" y="270" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<rect x="28" y="270" width="5" height="112" fill="#1E5F70"/>
<text x="48" y="301" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Index and payload</tspan></text>
<text x="48" y="331" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Add graph links, centroids, IDs and scalar</tspan><tspan x="48" dy="26">fields.</tspan></text>
<rect x="28" y="394" width="584" height="86" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
