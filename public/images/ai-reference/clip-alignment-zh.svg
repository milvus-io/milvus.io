<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc"><title id="title">CLIP：让配对图文的表示学会对齐</title><desc id="desc">Original explanatory diagram. Numeric examples are illustrative, not measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs><rect width="960" height="400" fill="#FAF6EE"/><g font-family="Georgia, Noto Serif SC, serif"><text x="36" y="36" fill="#6B6356" font-size="12" text-anchor="start">MILVUS / AI REFERENCE / CONCEPT DIAGRAM</text><text x="36" y="77" fill="#0F1F2E" font-size="26" text-anchor="start">CLIP：让配对图文的表示学会对齐</text><rect x="35" y="140" width="215" height="68" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="142" y="180" fill="#0F1F2E" font-size="20" text-anchor="middle">“红色小船”</text><rect x="35" y="235" width="215" height="82" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><path d="M90 286H196L178 302H108Z" fill="#E85A2B" stroke="#0F1F2E" stroke-width="1.5"/><path d="M141 251V286M144 252L175 279H144Z" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><rect x="310" y="140" width="190" height="68" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="405" y="180" fill="#0F1F2E" font-size="19" text-anchor="middle">文本编码器</text><rect x="310" y="242" width="190" height="68" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="405" y="283" fill="#0F1F2E" font-size="19" text-anchor="middle">图像编码器</text><path d="M250 174L305 174" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M250 276L305 276" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M500 174L566 190" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M500 276L566 257" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="5