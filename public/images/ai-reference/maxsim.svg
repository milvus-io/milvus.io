<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc"><title id="title">MaxSim: select per query vector, then sum</title><desc id="desc">Original explanatory diagram. Numeric examples are illustrative, not measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs><rect width="960" height="400" fill="#FAF6EE"/><g font-family="Georgia, Noto Serif SC, serif"><text x="36" y="36" fill="#6B6356" font-size="12" text-anchor="start">MILVUS / AI REFERENCE / CONCEPT DIAGRAM</text><text x="36" y="77" fill="#0F1F2E" font-size="26" text-anchor="start">MaxSim: select per query vector, then sum</text><text x="36" y="121" fill="#0F1F2E" font-size="18" text-anchor="start">Pairwise dot products of unit vectors</text><text x="190" y="154" fill="#0F1F2E" font-size="18" text-anchor="middle">d1</text><text x="295" y="154" fill="#0F1F2E" font-size="18" text-anchor="middle">d2</text><text x="400" y="154" fill="#0F1F2E" font-size="18" text-anchor="middle">d3</text><text x="80" y="206" fill="#0F1F2E" font-size="18" text-anchor="start">q1</text><rect x="140" y="172" width="100" height="55" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="190" y="206" fill="#0F1F2E" font-size="21" text-anchor="middle">0.8</text><rect x="245" y="172" width="100" height="55" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="295" y="206" fill="#0F1F2E" font-size="21" text-anchor="middle">0.6</text><rect x="350" y="172" width="100" height="55" fill="#1E5F70" stroke="#0F1F2E" stroke-width="1.5"/><text x="400" y="206" fill="#FAF6EE" font-size="21" text-anchor="middle">1.0</text><text x="80" y="269" fill="#0F1F2E" font-size="18" text-anchor="start">q2</text><rect x="140" y="235" width="100" height="55" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="190" y="269" fill="#0F1F2E" font-size="21" text-anchor="middle">0.6</text><rect x="245" y="235" width="100" height="55" fill="#1E5F70" stroke="#0F1F2E" stroke-width="1.5"/><text x="295" y="269" fill="#FAF6EE" font-size="21" text-anchor="middle">0.8</text><rect x="350" y="235" width="100" height="55" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/><text x="400" y="269" fill="#0F1F2E" font-size="21" text-anchor="middle">0.0</text><text x="520" y="185" fill="#0F1F2E" font-size="21" text-anchor="start">Max over each query row</text><text x="520" y="228" fill="#1E5F70" font-size="23" text-anchor="start">S(Q,D) = 1.0 + 0.8 = 1.8</text><text x="520" y="276" fill="#0F1F2E" font-size="20" text-anchor="start">Reverse roles: S(D,Q) = 2.6</text><text x="140" y="330" fill="#6B6356" font-size="16" text-anchor="start">q1=(1,0), q2=(0,1); d1=(.8,.6), d2=(.6,.8), d3=(1,0)</text><path d="M36 355L924 355" stroke="#0F1F2E" stroke-width="1.5" fill="none"/><text x="36" y="382" fill="#6B6356" font-size="14" text-anchor="start">TokenANN/MUVERA find candidates; MaxSim scores lists. Reranking cannot recover missing candidates.</text></g></svg>