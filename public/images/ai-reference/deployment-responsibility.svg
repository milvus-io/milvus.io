<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Your team operates the</tspan><tspan x="248" dy="27.3">deployment</tspan></text>
<text x="248" y="239" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Own capacity, upgrades and</tspan><tspan x="248" dy="24.7">recovery.</tspan></text>
<rect x="28" y="302" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 302 V446" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="334" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Managed</tspan><tspan x="44" dy="29.9">service</tspan></text>
<text x="248" y="333" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Provider runs the database</tspan><tspan x="248" dy="27.3">service</tspan></text>
<text x="248" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Check the documented service</tspan><tspan x="248" dy="24.7">boundary.</tspan></text>
<rect x="28" y="458" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 458 V602" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="490" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">BYOC</tspan></text>
<text x="248" y="489" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Service runs in your cloud</tspan><tspan x="248" dy="27.3">account</tspan></text>
<text x="248" y="551" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Clarify network, IAM and shared</tspan><tspan x="248" dy="24.7">duties.</tspan></text>
