<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 856" width="640" height="856" role="img" aria-labelledby="title desc">
<title id="title">Choose the operational responsibility boundary</title>
<desc id="desc">Self-hosted Milvus: Your team operates the deployment: Own capacity, upgrades and recovery.. Managed service: Provider runs the database service: Check the documented service boundary.. BYOC: Service runs in your cloud account: Clarify network, IAM and shared duties.. Decision criteria: Data control + SLO + total cost: Validate the support and compliance scope.. Account ownership alone does not describe every operational responsibility.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="856" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Choose the operational</tspan><tspan x="28" dy="36.4">responsibility boundary</tspan></text>
<rect x="28" y="146" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V290" stroke="#0F1F2E" stroke-width="1.5"/>
