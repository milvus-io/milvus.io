<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" role="img" aria-labelledby="dg-milvus-vs-lancedb"><style>text{font-family:Geist,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#010e29}.label{font-size:13px;fill:#36536a}.mini{font-size:11px;fill:#52718a}.strong{font-size:16px;font-weight:600}.flow-line{fill:none;stroke:#4b8eb5;stroke-width:1.6}.node{fill:#fff;stroke:#bed8e8;stroke-width:1.2}.active-node{fill:#010e29;stroke:#010e29}.active-text{fill:#fff}.mint-node{fill:#bfffe7;stroke:#81d5b7;stroke-width:1.2}.blue-node{fill:#d3efff;stroke:#81c9ef;stroke-width:1.2}.dot{fill:#00a1ea}.muted-dot{fill:#a8c3d5}.panel-main{fill:#fff;stroke:#9cc3dc;stroke-width:1.2}.panel-alt{fill:#f6f9fb;stroke:#d5dfe8;stroke-width:1.2}</style><title id="dg-milvus-vs-lancedb">对比 LanceDB 示意图</title><defs><marker id="ar-milvus-vs-lancedb" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 6 3.5 1 6" fill="none" stroke="#4b8eb5" stroke-width="1.2"/></marker><linearGradient id="gm-milvus-vs-lancedb" x1="0" x2="1"><stop offset="0" stop-color="#00a1ea"/><stop offset="1" stop-color="#65f8c3"/></linearGradient></defs><rect x="10" y="10" width="240" height="304" rx="10" class="panel-main"/><rect x="10" y="10" width="240" height="4" rx="2" fill="url(#gm-milvus-vs-lancedb)"/><text x="24" y="36" class="strong">Milvus：存算分离</text><text x="24" y="52" class="mini">无状态 worker，按类型各自扩缩</text><rect x="24.0" y="68" width="65.3" height="74" rx="7" class="blue-node"/><text x="56.7" y="96" text-anchor="middle" class="label" style="font-weight:600;font-size:10.6px">Streaming</text><text x="56.7" y="114" text-anchor="middle" class="mini">写入 · WAL</text><path d="M56.7 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="97.3" y="68" width="65.3" height="74" rx="7" class="blue-node"/><text x="130.0" y="96" text-anchor="middle" class="label" style="font-weight:600">Query</text><text x="130.0" y="114" text-anchor="middle" class="mini" style="font-size:10.0px">检索 · 副本</text><path d="M130.0 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="170.7" y="68" width="65.3" height="74" rx="7" class="blue-node"/><text x="203.3" y="96" text-anchor="middle" class="label" style="font-weight:600">Data</text><text x="203.3" y="114" text-anchor="middle" class="mini">建索引</text><path d="M203.3 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="24" y="170" width="212" height="56" rx="7" class="active-node"/><text x="130.0" y="193" text-anchor="middle" class="strong active-text">共享对象存储</text><text x="130.0" y="212" text-anchor="middle" class="mini active-text">对象存储 · Lance 原地检索</text><text x="24" y="252" class="label" style="font-weight:600">加节点：直接从存储加载 segment。</text><text x="24" y="268" class="label">可到数百亿向量。</text><circle cx="260.0" cy="162.0" r="13" fill="#fff" stroke="#c7d4e0"/><text x="260.0" y="166.0" text-anchor="middle" class="mini" style="font-weight:700;fill:#52718a">vs</text><rect x="270" y="10" width="240" height="304" rx="10" class="panel-alt"/><rect x="270" y="10" width="240" height="4" rx="2" fill="#c7d4e0"/><text x="284" y="36" class="strong" style="font-size:14.7px">LanceDB：嵌入式，底层 Lance</text><text x="284" y="52" class="mini">跑在你的应用进程里</text><rect x="284.0" y="68" width="65.3" height="74" rx="7" class="node"/><text x="316.7" y="96" text-anchor="middle" class="label" style="font-weight:600;font-size:13.1px">你的应用</text><text x="316.7" y="114" text-anchor="middle" class="mini" style="font-size:10.4px">LanceDB 进</text><text x="316.7" y="127" text-anchor="middle" class="mini">程内</text><path d="M316.7 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="357.3" y="68" width="65.3" height="74" rx="7" class="node"/><text x="390.0" y="96" text-anchor="middle" class="label" style="font-weight:600;font-size:12.2px">Lance 表</text><text x="390.0" y="114" text-anchor="middle" class="mini" style="font-size:10.2px">fragment ·</text><text x="390.0" y="127" text-anchor="middle" class="mini">版本</text><path d="M390.0 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="430.7" y="68" width="65.3" height="74" rx="7" class="node"/><text x="463.3" y="96" text-anchor="middle" class="label" style="font-weight:600">索引</text><text x="463.3" y="114" text-anchor="middle" class="mini">IVF · 全</text><text x="463.3" y="127" text-anchor="middle" class="mini">文 · 标量</text><path d="M463.3 142V166" class="flow-line" marker-end="url(#ar-milvus-vs-lancedb)"/><rect x="284" y="170" width="212" height="56" rx="7" class="mint-node"/><text x="390.0" y="193" text-anchor="middle" class="strong">本地盘或对象存储</text><text x="390.0" y="212" text-anchor="middle" class="mini" style="font-size:9.8px">NVMe、EBS、EFS、S3；带版本的 Lance 文件</text><text x="284" y="252" class="label" style="font-weight:600">规模 = 宿主进程。Enterprise 版</text><text x="284" y="268" class="label">才有 query 节点、plan executor</text><text x="284" y="284" class="label">和 indexer。</text></svg>