<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" width="640" height="830" role="img" aria-labelledby="title desc">
<title id="title">Three places to generate a representation</title>
<desc id="desc">Client library: Your process calls an encoder: Produces vectors before insert / search.. Model endpoint: A separate service runs inference: Owns batching, capacity and revisions.. Milvus Function: Server-side configured transformation: Availability depends on version / provider.. Milvus index: Stores and searches representations: Does not imply arbitrary model support.. A wrapper export is not proof of executed inference or universal compatibility.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
<rect width="640" height="830" fill="#FAF6EE"/>
<text x="28" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">MILVUS / AI REFERENCE / SCHEMATIC</tspan></text>
<text x="28" y="72" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#0F1F2E"><tspan x="28" dy="0">Three places to generate a</tspan><tspan x="28" dy="36.4">representation</tspan></text>
<rect x="28" y="146" width="584" height="118" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 146 V264" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Client library</tspan></text>
<text x="248" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Your process calls an encoder</tspan></text>
<text x="248" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Produces vectors before insert /</tspan><tspan x="248" dy="24.7">search.</tspan></text>
<rect x="28" y="276" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 276 V420" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Model endpoint</tspan></text>
<text x="248" y="307" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">A separate service runs</tspan><tspan x="248" dy="27.3">inference</tspan></text>
<text x="248" y="369" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Owns batching, capacity and</tspan><tspan x="248" dy="24.7">revisions.</tspan></text>
<rect x="28" y="432" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 432 V576" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="464" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Milvus</tspan><tspan x="44" dy="29.9">Function</tspan></text>
<text x="248" y="463" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Server-side configured</tspan><tspan x="248" dy="27.3">transformation</tspan></text>
<text x="248" y="525" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Availability depends on version /</tspan><tspan x="248" dy="24.7">provider.</tspan></text>
<rect x="28" y="588" width="584" height="144" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
<path d="M230 588 V732" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="44" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1E5F70"><tspan x="44" dy="0">Milvus index</tspan></text>
<text x="248" y="619" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F1F2E"><tspan x="248" dy="0">Stores and searches</tspan><tspan x="248" dy="27.3">representations</tspan></text>
<text x="248" y="681" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#6B6356"><tspan x="248" dy="0">Does not imply arbitrary model</tspan><tspan x="248" dy="24.7">support.</tspan></text>
<path d="M28 754 H612" stroke="#0F1F2E" stroke-width="1.5"/>
<text x="28" y="780" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6356"><tspan x="28" dy="0">A wrapper export is not proof of executed inference or</tspan><tspan x="28" dy="23.4">universal compatibility.</tspan></text>
</svg>
