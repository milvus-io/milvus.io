<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 702" width="640" height="702" role="img" aria-labelledby="title desc">
<title id="title">Separate remote storage from the hot working set</title>
<desc id="desc">RAM: Hot index structures, cached pages and query execution.. Local SSD: Larger indexes, fetched chunks and mapped field files.. Object storage / lake: Durable source data, snapshots and cold objects.. Access policy: Warm up, fetch and evict according to the workload.. Benchmark cold starts and shifted traffic, not only a warm cache.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs>
