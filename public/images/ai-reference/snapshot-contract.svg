<text x="48" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Pin lake and collection versions; retain the</tspan><tspan x="48" dy="26">files.</tspan></text>
<rect x="28" y="270" width="584" height="112" fill="#F4ECDC" stroke="#0F1F2E" stroke-width="1.5"/>
