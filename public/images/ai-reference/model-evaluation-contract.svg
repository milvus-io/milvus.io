<text x="48" y="513" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Test your application</tspan></text>
<text x="48" y="543" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Measure relevance, latency, cost and operating</tspan><tspan x="48" dy="26">limits.</tspan></text>
<path d="M28 616 H612" stroke="#0F1F2E" stroke-width="1.5"/>
