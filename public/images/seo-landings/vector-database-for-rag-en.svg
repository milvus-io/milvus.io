<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 324" role="img" aria-labelledby="dg-vector-database-for-rag"><style>text{font-family:Geist,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#010e29}.label{font-size:13px;fill:#36536a}.mini{font-size:11px;fill:#52718a}.strong{font-size:16px;font-weight:600}.flow-line{fill:none;stroke:#4b8eb5;stroke-width:1.6}.node{fill:#fff;stroke:#bed8e8;stroke-width:1.2}.active-node{fill:#010e29;stroke:#010e29}.active-text{fill:#fff}.mint-node{fill:#bfffe7;stroke:#81d5b7;stroke-width:1.2}.blue-node{fill:#d3efff;stroke:#81c9ef;stroke-width:1.2}.dot{fill:#00a1ea}.muted-dot{fill:#a8c3d5}.panel-main{fill:#fff;stroke:#9cc3dc;stroke-width:1.2}.panel-alt{fill:#f6f9fb;stroke:#d5dfe8;stroke-width:1.2}</style><title id="dg-vector-database-for-rag">Vector database for RAG diagram</title><defs><marker id="ar-vector-database-for-rag" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 6 3.5 1 6" fill="none" stroke="#4b8eb5" stroke-width="1.2"/></marker></defs><rect x="60" y="14" width="400" height="62" rx="7" class="node"/><text x="260.0" y="41.5" class="strong" text-anchor="middle">User question</text><text x="260.0" y="59.5" class="mini" text-anchor="middle">text + tenant / metadata context</text><path d="M260 76V98H88.66666666666667V124" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><path d="M260 76V98H260.0V124" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><path d="M260 76V98H431.33333333333337V124" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><rect x="10.0" y="124" width="157.33333333333334" height="76" rx="7" class="blue-node"/><text x="88.66666666666667" y="151.0" class="strong" text-anchor="middle">Dense ANN search</text><text x="88.66666666666667" y="169.0" class="mini" text-anchor="middle">meaning: paraphrases,</text><text x="88.66666666666667" y="184.0" class="mini" text-anchor="middle">synonyms</text><rect x="181.33333333333334" y="124" width="157.33333333333334" height="76" rx="7" class="blue-node"/><text x="260.0" y="151.0" class="strong" text-anchor="middle" style="font-size:13.5px">BM25 + grep filters</text><text x="260.0" y="169.0" class="mini" text-anchor="middle">exact terms, regex:</text><text x="260.0" y="184.0" class="mini" text-anchor="middle">error codes, SKUs</text><rect x="352.6666666666667" y="124" width="157.33333333333334" height="76" rx="7" class="blue-node"/><text x="431.33333333333337" y="151.0" class="strong" text-anchor="middle" style="font-size:10.7px">Metadata + tenant filter</text><text x="431.33333333333337" y="169.0" class="mini" text-anchor="middle">partition key, ACL,</text><text x="431.33333333333337" y="184.0" class="mini" text-anchor="middle">date, source</text><path d="M88.66666666666667 200V222H260V246" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><path d="M260.0 200V222H260V246" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><path d="M431.33333333333337 200V222H260V246" class="flow-line" marker-end="url(#ar-vector-database-for-rag)"/><rect x="90" y="246" width="340" height="66" rx="7" class="active-node"/><text x="260.0" y="275.5" class="strong active-text" text-anchor="middle">Fuse + rerank chain → top-k chunks</text><text x="260.0" y="293.5" class="mini active-text" text-anchor="middle">RRF / weighted, model or XGBoost rerank → LLM prompt</text></svg>