<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" width="640" height="780" role="img" aria-labelledby="title desc">
<title id="title">IVF probes lists around selected centroids</title>
<desc id="desc">Four schematic cells have one centroid each. With nprobe set to two, the query probes the two closer centroids on the left and scores their list members. Unprobed lists are skipped.</desc>
