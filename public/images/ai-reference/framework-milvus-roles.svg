<text x="48" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1F2E"><tspan x="48" dy="0">Milvus collection</tspan></text>
<text x="48" y="483" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B6356"><tspan x="48" dy="0">Stores vectors and metadata; filters and</tspan><tspan x="48" dy="26">retrieves.</tspan></text>
