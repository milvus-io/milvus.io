<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc"><title id="title">方向、模长和两点距离，会产生不同排序</title><desc id="desc">Original explanatory diagram. Numeric examples are illustrative, not measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1E5F70" stroke-width="1.5"/></marker></defs><rect width="960" height="400" fill="#FAF6EE"/><g font-family="Georgia, Noto Serif SC, serif"><text x="36" y="36" fill="#6B6356" font-size="12" text-anchor="start">MILVUS / AI REFERENCE / CONCEPT DIAGRAM</text><text x="36" y="77" fill="#0F1F2E" font-size="26" text-anchor="start">方向、模长和两点距离，会产生不同排序</text><path d="M65 285L370 285" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M75 305L75 125" stroke="#1E5F70" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M75 285L175 285" stroke="#E85A2B" stroke-width="1.5" fill="none"/><circle cx="175" cy="285" r="5" fill="#E85A2B"/><path d="M75 285L155 225" stroke="#1E5F70" stroke-width="1.5" fill="none"/><circle cx="155" cy="225" r="5" fill="#1E5F70"/><path d="M75 285L275 285" stroke="#1E5F70" stroke-width="1.5" fill="none"/><circle cx="275" cy="285" r="5" fill="#1E5F70"/><path d="M175 285L155 225" stroke="#6B6356" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M155 225L155 285" stroke="#6B6356" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="75" y="329" fill="#0F1F2E" font-size="14" text-anchor="start">O=(0,0)</text><text x="178" y="308" fill="#E85A2B" font-size="16" text-anchor="start">q=(1,0)</text><text x="142" y="204" fill="#1E5F70" font-size="16" text-anchor="start">A=(0.8,0.6)</text><text x="275" y="267" fill="#1E5F70" font-size="16" text-anchor="start">B=(2,0)</text><text x="445" y="127" fill="#0F1F2E" font-size="18" text-anchor="start">同一查询 q，比较 A 与 B</text><text x="445" y="165" fill="#0F1F2E" font-size="20" text-anchor="start">Cosine</text><text x="575" y="165" fill="#0F1F2E" font-size="18" text-anchor="start">A: 0.8</text><text x="680" y="165" fill="#0F1F2E" font-size="18" text-anchor="start">B: 1.0</text><text x="800" y="165" fill="#E85A2B" font-size="18" text-anchor="start">优先：B</text><text x="445" y="224" fill="#0F1F2E" font-size="20" text-anchor="start">IP</text><text x="575" y="224" fill="#0F1F2E" font-size="18" text-anchor="start">A: 0.8</text><text x="680" y="224" fill="#0F1F2E" font-size="18" text-anchor="start">B: 2.0</text><text x="800" y="224" fill="#E85A2B" font-size="18" text-anchor="start">优先：B</text><text x="445" y="283" fill="#0F1F2E" font-size="20" text-anchor="start">L2²</text><text x="575" y="283" fill="#0F1F2E" font-size="18" text-anchor="start">A: 0.4</text><text x="680" y="283" fill="#0F1F2E" font-size="18" text-anchor="start">B: 1.0</text><text x="800" y="283" fill="#E85A2B" font-size="18" text-anchor="start">优先：A</text><path d="M36 355L924 355" stroke="#0F1F2E" stroke-width="1.5" fill="none"/><text x="36" y="382" fill="#6B6356" font-size="14" text-anchor="start">平方 L2 看分离距离；余弦看方向；内积还受模长影响。示例非效果实测。</text></g></svg>